name: Vietnam market data tests

on:
  pull_request:
    branches: [main]
    paths:
      - "tradingagents/dataflows/vietnam_market/**"
      - "tests/test_vietnam_market_*.py"
      - "pyproject.toml"
      - ".github/workflows/vietnam-market-tests.yml"
  push:
    branches: ["feature/vietnam-market-foundation"]
    paths:
      - "tradingagents/dataflows/vietnam_market/**"
      - "tests/test_vietnam_market_*.py"
      - "pyproject.toml"
      - ".github/workflows/vietnam-market-tests.yml"

permissions:
  contents: read

jobs:
  test-vietnam-market:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and optional test/SSI dependencies
        run: python -m pip install -e ".[dev,ssi]"
      - name: Run Vietnam market data unit tests
        run: python -m pytest -q tests/test_vietnam_market_models.py tests/test_vietnam_market_ssi.py tests/test_vietnam_market_smoke.py tests/test_vietnam_market_technicals.py tests/test_vietnam_market_fundamentals.py
      - name: Lint Vietnam market data code
        run: ruff check tradingagents/dataflows/vietnam_market tests/test_vietnam_market_models.py tests/test_vietnam_market_ssi.py tests/test_vietnam_market_smoke.py tests/test_vietnam_market_technicals.py tests/test_vietnam_market_fundamentals.py

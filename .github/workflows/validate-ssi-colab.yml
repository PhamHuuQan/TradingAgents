name: Validate SSI Colab notebook

on:
  push:
    branches:
      - "fix/ssi-sdk-ohlc-colab-20261026"
    paths:
      - "notebooks/SSI_FastConnect_OHLC_FPT_Fixed.ipynb"
      - "notebooks/validate_ssi_ohlc_notebook.py"
      - ".github/workflows/validate-ssi-colab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned SSI SDK and test dependencies
        run: python -m pip install --disable-pip-version-check "ssi-sdk==3.3.2" "pandas>=2.0"

      - name: Validate notebook syntax, SDK signatures, and mocked execution
        run: python notebooks/validate_ssi_ohlc_notebook.py

name: Validate fresh TradingAgents Colab notebook

on:
  push:
    branches:
      - "feature/fpt-fresh-notebook-20261026"
    paths:
      - "notebooks/TradingAgents_FPT_Fresh_Run_And_Report.ipynb"
      - "tests/test_fpt_fresh_notebook.py"
      - ".github/workflows/validate-fpt-fresh-notebook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-and-fallback-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate notebook syntax and runtime fallback behavior with fake models
        run: python -m unittest discover -s tests -p "test_fpt_fresh_notebook.py" -v
